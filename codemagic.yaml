workflows:
  ios-workflow:
    name: Build iOS IPA
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install CocoaPods (empty Podfile)
        script: |
          cat > Podfile << 'EOF'
          platform :ios, '15.0'
          target 'Penafort Supermarket' do
          end
          EOF
          rm -rf Pods Podfile.lock
          pod install --repo-update

      - name: Build Archive without signing
        script: |
          WORKSPACE_PATH=$(find . -name "*.xcworkspace" -maxdepth 3 | head -1)
          if [ -z "$WORKSPACE_PATH" ]; then
            echo "❌ No workspace found after pod install!"
            exit 1
          fi
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE_PATH" 2>/dev/null | grep -A 1 "Schemes:" | tail -1 | sed 's/^[[:space:]]*//')
          if [ -z "$SCHEME" ]; then
            SCHEME="Penafort Supermarket"
          fi
          echo "✅ Using workspace: $WORKSPACE_PATH, scheme: $SCHEME"
          xcodebuild archive \
            -workspace "$WORKSPACE_PATH" \
            -scheme "$SCHEME" \
            -archivePath "$HOME/build/ios/xcarchive/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package unsigned IPA
        script: |
          mkdir -p "$HOME/build/ios/ipa/Payload"
          cp -R "$HOME/build/ios/xcarchive/App.xcarchive/Products/Applications/"*.app "$HOME/build/ios/ipa/Payload/"
          cd "$HOME/build/ios/ipa"
          zip -r "PenafortSupermarket-unsigned.ipa" Payload
          rm -rf Payload
          echo "✅ IPA created successfully."
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - mickevsono@gmail.com
