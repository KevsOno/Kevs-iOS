workflows:
  ios-workflow:
    name: Build iOS IPA
    max_build_duration: 30
    environment:
      xcode: latest
      vars:
        XC_WORKSPACE: "Penafort Supermarket"
    scripts:
      - name: List directory contents
        script: |
          echo "=== Current directory ==="
          pwd
          ls -la
          echo "=== Workspace files ==="
          find . -name "*.xcworkspace" -maxdepth 3
          echo "=== Project files ==="
          find . -name "*.xcodeproj" -maxdepth 3
      - name: Build IPA file
        script: |
          xcode-project build-ipa \
            --workspace "$XC_WORKSPACE.xcworkspace" \
            --scheme "$XC_WORKSPACE"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - mickevsono@gmail.com
