workflows:
  ios-workflow:
    name: Build iOS IPA
    max_build_duration: 30
    environment:
      xcode: latest
      cocoapods: default
      vars:
        XC_WORKSPACE: "Penafort Supermarket"
    scripts:
      - name: List directory contents
        script: |
          echo "=== Current directory ==="
          pwd
          ls -la
          echo "=== Looking for workspace ==="
          find . -name "*.xcworkspace" -maxdepth 3
          echo "=== Looking for Podfile ==="
          find . -name "Podfile" -maxdepth 3
      - name: Ensure Podfile exists
        script: |
          if [ ! -f "Podfile" ]; then
            echo "📄 No Podfile found. Creating a minimal one..."
            echo "platform :ios, '14.0'" > Podfile
            echo "target 'Penafort Supermarket' do" >> Podfile
            echo "end" >> Podfile
            echo "✅ Podfile created."
            cat Podfile
          else
            echo "✅ Podfile found."
            # Remove UTF-8 BOM if present
            sed -i '1s/^\xEF\xBB\xBF//' Podfile || true
            cat Podfile
          fi
      - name: Install CocoaPods dependencies
        script: |
          pod install --verbose
      - name: Build IPA file
        script: |
          xcode-project build-ipa \
            --workspace "$XC_WORKSPACE.xcworkspace" \
            --scheme "$XC_WORKSPACE"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - mickevsono@gmail.com
