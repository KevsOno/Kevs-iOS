workflows:
  ios-workflow:
    name: Build iOS IPA (No Firebase)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Remove Firebase imports from source
        script: |
          # Comment out Firebase import lines in AppDelegate.swift
          sed -i '' 's/^import FirebaseCore/\/\/ import FirebaseCore/' "Penafort Supermarket/AppDelegate.swift"
          sed -i '' 's/^import FirebaseMessaging/\/\/ import FirebaseMessaging/' "Penafort Supermarket/AppDelegate.swift"
          # Also comment out any Firebase usage (like FirebaseApp.configure())
          sed -i '' 's/^[[:space:]]*FirebaseApp\.configure()/\/\/ FirebaseApp.configure()/' "Penafort Supermarket/AppDelegate.swift"
          # Comment out in PushNotifications.swift if present
          sed -i '' 's/^import FirebaseCore/\/\/ import FirebaseCore/' "Penafort Supermarket/PushNotifications.swift" 2>/dev/null || true
          sed -i '' 's/^import FirebaseMessaging/\/\/ import FirebaseMessaging/' "Penafort Supermarket/PushNotifications.swift" 2>/dev/null || true
          echo "✅ Firebase imports commented out."
      - name: Build Archive without signing
        script: |
          PROJECT_PATH=$(find . -name "*.xcodeproj" -maxdepth 3 | head -1)
          if [ -z "$PROJECT_PATH" ]; then
            echo "❌ No project found!"
            exit 1
          fi
          SCHEME=$(xcodebuild -list -project "$PROJECT_PATH" 2>/dev/null | grep -A 1 "Schemes:" | tail -1 | sed 's/^[[:space:]]*//')
          if [ -z "$SCHEME" ]; then
            SCHEME="Penafort Supermarket"
          fi
          echo "✅ Using project: $PROJECT_PATH, scheme: $SCHEME"
          xcodebuild archive \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -archivePath "$HOME/build/ios/xcarchive/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
      - name: Package unsigned IPA
        script: |
          mkdir -p "$HOME/build/ios/ipa/Payload"
          cp -R "$HOME/build/ios/xcarchive/App.xcarchive/Products/Applications/"*.app "$HOME/build/ios/ipa/Payload/"
          cd "$HOME/build/ios/ipa"
          zip -r "PenafortSupermarket-unsigned.ipa" Payload
          rm -rf Payload
          echo "✅ IPA created successfully."
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - mickevsono@gmail.com
