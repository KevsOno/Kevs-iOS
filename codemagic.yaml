workflows:
  ios-workflow:
    name: Build iOS IPA
    max_build_duration: 30
    environment:
      xcode: latest
      cocoapods: default
      vars:
        XC_WORKSPACE: "Penafort Supermarket"   # <-- MATCHES YOUR FILE EXACTLY
    scripts:
      - name: Install CocoaPods dependencies
        script: |
          cd src
          pod install --repo-update
      - name: Build IPA file
        script: |
          cd src
          xcode-project build-ipa \
            --workspace "$XC_WORKSPACE.xcworkspace" \
            --scheme "$XC_WORKSPACE"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - mickevsono@gmail.com
