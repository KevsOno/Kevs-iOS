workflows:
  ios-workflow:
    name: Build iOS IPA
    max_build_duration: 30
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: List directory contents
        script: |
          echo "=== Current directory ==="
          pwd
          ls -la
          echo "=== Workspace files ==="
          find . -name "*.xcworkspace" -maxdepth 3
          echo "=== Project files ==="
          find . -name "*.xcodeproj" -maxdepth 3
      - name: Prepare Podfile and install
        script: |
          # Ensure Podfile exists with correct target
          if [ ! -f "Podfile" ]; then
            echo "📄 Creating Podfile..."
            echo 'platform :ios, "14.0"' > Podfile
            echo 'target "Penafort Supermarket" do' >> Podfile
            echo "  # No dependencies needed" >> Podfile
            echo "end" >> Podfile
          fi
          # Install pods (even with no dependencies, it creates necessary files)
          echo "🔄 Running pod install..."
          pod install --verbose
      - name: Build IPA
        script: |
          # Find the workspace
          WORKSPACE_PATH=$(find . -name "*.xcworkspace" -maxdepth 3 | head -1)
          if [ -z "$WORKSPACE_PATH" ]; then
            echo "❌ No .xcworkspace found!"
            exit 1
          fi
          echo "✅ Found workspace: $WORKSPACE_PATH"
          # Extract the scheme
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE_PATH" 2>/dev/null | grep -A 1 "Schemes:" | tail -1 | sed 's/^[[:space:]]*//')
          if [ -z "$SCHEME" ]; then
            SCHEME=$(basename "$WORKSPACE_PATH" .xcworkspace)
            echo "⚠️ No scheme found, using workspace name: $SCHEME"
          else
            echo "✅ Found scheme: $SCHEME"
          fi
          # Create export options plist with development method
          echo "Creating export options plist..."
          echo '<?xml version="1.0" encoding="UTF-8"?>' > export_options.plist
          echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' >> export_options.plist
          echo '<plist version="1.0">' >> export_options.plist
          echo '<dict>' >> export_options.plist
          echo '    <key>method</key>' >> export_options.plist
          echo '    <string>development</string>' >> export_options.plist
          echo '    <key>signingStyle</key>' >> export_options.plist
          echo '    <string>manual</string>' >> export_options.plist
          echo '    <key>provisioningProfiles</key>' >> export_options.plist
          echo '    <dict/>' >> export_options.plist
          echo '</dict>' >> export_options.plist
          echo '</plist>' >> export_options.plist
          # Build the IPA with archive flags to disable problematic capabilities
          xcode-project build-ipa \
            --workspace "$WORKSPACE_PATH" \
            --scheme "$SCHEME" \
            --export-options-plist export_options.plist \
            --archive-flags "CODE_SIGN_IDENTITY=iPhone Developer" \
            --archive-flags "PROVISIONING_PROFILE_SPECIFIER=" \
            --archive-flags "DEVELOPMENT_TEAM="
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - mickevsono@gmail.com
