workflows:
  ios-workflow:
    name: Build iOS Unsigned IPA
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install CocoaPods dependencies
        script: |
          # Create a proper Podfile with Firebase
          if [ ! -f "Podfile" ]; then
            echo 'platform :ios, "14.0"' > Podfile
            echo 'target "Penafort Supermarket" do' >> Podfile
            echo '  use_frameworks! :linkage => :static' >> Podfile
            echo '  pod "FirebaseCore", "~> 11.0"' >> Podfile
            echo '  pod "FirebaseMessaging", "~> 11.0"' >> Podfile
            echo 'end' >> Podfile
          fi
          pod install --repo-update

      - name: List directory contents
        script: |
          echo "=== Workspace files ==="
          find . -name "*.xcworkspace" -maxdepth 3
          echo "=== Project files ==="
          find . -name "*.xcodeproj" -maxdepth 3

      - name: Build Archive without code signing
        script: |
          WORKSPACE_PATH=$(find . -name "*.xcworkspace" -maxdepth 3 | head -1)
          PROJECT_PATH=$(find . -name "*.xcodeproj" -maxdepth 3 | head -1)

          if [ -n "$WORKSPACE_PATH" ]; then
            echo "Using workspace: $WORKSPACE_PATH"
            SCHEME=$(xcodebuild -list -workspace "$WORKSPACE_PATH" 2>/dev/null | grep -A 1 "Schemes:" | tail -1 | sed 's/^[[:space:]]*//')
            if [ -z "$SCHEME" ]; then
              SCHEME="Penafort Supermarket"
            fi
            xcodebuild archive \
              -workspace "$WORKSPACE_PATH" \
              -scheme "$SCHEME" \
              -archivePath "$HOME/build/ios/xcarchive/App.xcarchive" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              PROVISIONING_PROFILE_SPECIFIER="" \
              SWIFT_ENABLE_EXPLICIT_MODULES=NO
          else
            echo "Using project: $PROJECT_PATH"
            SCHEME=$(xcodebuild -list -project "$PROJECT_PATH" 2>/dev/null | grep -A 1 "Schemes:" | tail -1 | sed 's/^[[:space:]]*//')
            if [ -z "$SCHEME" ]; then
              SCHEME="Penafort Supermarket"
            fi
            xcodebuild archive \
              -project "$PROJECT_PATH" \
              -scheme "$SCHEME" \
              -archivePath "$HOME/build/ios/xcarchive/App.xcarchive" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              PROVISIONING_PROFILE_SPECIFIER="" \
              SWIFT_ENABLE_EXPLICIT_MODULES=NO
          fi

      - name: Package Unsigned IPA manually
        script: |
          mkdir -p "$HOME/build/ios/ipa/Payload"
          cp -R "$HOME/build/ios/xcarchive/App.xcarchive/Products/Applications/"*.app "$HOME/build/ios/ipa/Payload/"
          cd "$HOME/build/ios/ipa"
          zip -r "PenafortSupermarket-unsigned.ipa" Payload
          rm -rf Payload
          echo "✅ Unsigned IPA created successfully."

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      email:
        recipients:
          - mickevsono@gmail.com
